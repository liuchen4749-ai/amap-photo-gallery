<title>足迹｜照片地图 · 只读分享版</title>
<style>
:root{--bg:#101b21;--panel:#15232a;--panel2:#213138;--line:rgba(255,255,255,.11);--text:#f3f6f7;--muted:#a0b1ba;--accent:#b9ee69;--radius:18px}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--text);overscroll-behavior:none}button,input{font:inherit}button{border:0;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible{outline:2px solid var(--accent)}.hide{display:none!important}

#topbar{position:absolute;left:0;right:0;top:0;z-index:20;padding:calc(env(safe-area-inset-top) + 13px) 16px 10px;background:linear-gradient(to bottom,rgba(12,22,28,.93),rgba(12,22,28,.77) 80%,transparent)}.topline{display:flex;align-items:center;justify-content:space-between;gap:10px}.identity{display:flex;align-items:center;gap:9px;min-width:0}.logo{height:38px;width:38px;background:var(--accent);border-radius:12px;display:flex;align-items:center;justify-content:center;color:#1a281d;font-size:22px;flex-shrink:0}.brand{font-weight:800;font-size:17px;letter-spacing:.7px;white-space:nowrap}.caption{font-size:10px;color:#b2c2c5;margin-top:2px;letter-spacing:.2px}.topactions{display:flex;gap:7px}.round{width:39px;height:39px;border-radius:13px;background:#22343c;color:var(--text);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:19px}.round.primary{background:var(--accent);color:#1d2e19;border-color:var(--accent)}.status{display:inline-flex;align-items:center;gap:7px;border-radius:30px;padding:7px 10px;background:rgba(16,29,34,.79);border:1px solid var(--line);backdrop-filter:blur(8px);color:#d7e4e7;font-size:11px;margin-top:10px}.dot{width:6px;height:6px;background:var(--accent);border-radius:50%}

#credit{position:absolute;bottom:calc(82px + env(safe-area-inset-bottom));left:10px;z-index:8;font-size:9px;color:#fff9;text-shadow:0 1px 3px black;background:rgba(0,0,0,.3);max-width:66%;padding:2px 5px;border-radius:5px}#mapErr{position:absolute;z-index:11;left:50%;top:29%;transform:translateX(-50%);width:max-content;max-width:84%;text-align:center;background:#12242bee;border:1px solid #ffffff32;border-radius:12px;color:#d7e5e7;padding:10px 13px;font-size:12px;line-height:1.6;pointer-events:none}#crosshair{position:absolute;left:50%;top:50%;z-index:12;transform:translate(-50%,-50%);font-size:39px;color:var(--accent);text-shadow:0 3px 12px black;pointer-events:none}.manualbar{position:absolute;z-index:25;left:10px;right:10px;bottom:calc(82px + env(safe-area-inset-bottom));background:#17282d;padding:13px;border-radius:15px;box-shadow:0 8px 35px #0009}.manualbar p{font-size:12px;color:var(--muted);margin:0 0 8px}.manualbar button{width:100%}
#empty{position:absolute;left:17px;right:17px;top:45%;transform:translateY(-50%);z-index:10;background:rgba(15,26,32,.88);padding:23px;border:1px solid #ffffff25;border-radius:24px;box-shadow:0 8px 45px #0007;backdrop-filter:blur(12px);max-width:440px;margin:auto;text-align:left}.welcome-icon{width:47px;height:47px;border-radius:17px;background:#b9ee691e;color:var(--accent);font-size:29px;display:flex;align-items:center;justify-content:center;margin-bottom:13px}#empty h1{font-size:22px;margin:0 0 7px}#empty p{font-size:13px;line-height:1.75;color:#b8c6cd;margin:0 0 15px}.tipline{font-size:11px;color:#c4d0d4;margin-top:10px}.tips-accent{color:var(--accent)}
#shade{position:absolute;inset:0;z-index:38;background:rgba(4,9,11,.56);backdrop-filter:blur(2px)}.sheet{position:absolute;z-index:40;left:0;right:0;bottom:0;background:#152329;border-radius:24px 24px 0 0;box-shadow:0 -13px 50px #0009;max-height:min(84dvh,800px);display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom);border-top:1px solid #ffffff1d}.handle{width:41px;height:4px;border-radius:10px;background:#5d737a;margin:11px auto 8px}.sheet-head{padding:7px 18px 13px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.sheet h2{font-size:19px;line-height:1.3;margin:0}.sub{font-size:12px;color:var(--muted);margin-top:5px}.xbtn{width:33px;height:33px;background:#304048;color:#e6eeef;border-radius:11px;font-size:21px;flex-shrink:0}.sheet-body{overflow-y:auto;overscroll-behavior:contain;padding:0 16px 20px}.choice{background:#203139;border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:11px;width:100%;text-align:left;color:#eff5f6;display:flex;align-items:flex-start;gap:12px}.choice .ico{font-size:23px;width:30px;flex-shrink:0}.choice b{font-size:14px}.choice p{font-size:12px;line-height:1.5;color:var(--muted);margin:5px 0 0}.infobox{padding:13px;border-radius:14px;background:#142e2a;border:1px solid #42613d;color:#d9f6c6;font-size:12px;line-height:1.7;margin-bottom:12px}.labelsm{font-size:12px;color:#b8c8ce;margin:12px 0 8px}.photos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.photo{position:relative;border-radius:11px;overflow:hidden;aspect-ratio:1;background:#273940;border:0;padding:0;color:#f0f5f5;display:flex;align-items:center;justify-content:center;min-width:0}.photo img{width:100%;height:100%;object-fit:cover}.photo .nogps{position:absolute;top:5px;left:5px;background:#a9561c;color:#fff;padding:3px 4px;font-size:9px;border-radius:5px}.photo .date{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,#000b);font-size:9px;padding:12px 3px 4px;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.photo.placeholder{background:#2d434a;font-size:24px}.progress{background:#18252b;border-radius:15px;padding:14px;margin-top:10px;border:1px solid #ffffff17}.progress b{font-size:13px}.progress p{font-size:12px;color:var(--muted)}.bar{height:6px;background:#365056;border-radius:8px;overflow:hidden;margin:10px 0}.bar>i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}.simpleInput{width:100%;background:#24363e;border:1px solid var(--line);border-radius:12px;color:#fff;padding:13px;outline:none}.muted{color:var(--muted);font-size:12px;line-height:1.75}.muted strong{color:#e8f2ed}.detailImg{width:100%;max-height:49vh;object-fit:contain;background:#071116;border-radius:13px}.detailmeta{font-size:12px;line-height:1.8;color:#b4c5ca;padding:10px 0}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.pill{background:#30454d;border:1px solid #ffffff1a;color:#dce9ec;font-size:11px;padding:5px 10px;border-radius:20px}.viewlist{display:flex;gap:10px;overflow-x:auto;padding:0 1px 12px}.viewlist .photo{width:91px;min-width:91px}.ins{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:12px 0;color:#c7d6dc;font-size:13px}.ins b{color:var(--text)}
#viewer{position:absolute;z-index:60;inset:0;background:#04090ceF;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:35px 9px 65px}#viewer img{max-width:100%;max-height:80%;object-fit:contain}#viewer .close{position:absolute;right:17px;top:calc(env(safe-area-inset-top) + 17px);z-index:65}#viewer .viewertitle{position:absolute;bottom:calc(22px + env(safe-area-inset-bottom));left:15px;right:15px;text-align:center;color:#b9cbd1;font-size:12px}
#toast{position:absolute;z-index:85;left:50%;bottom:calc(105px + env(safe-area-inset-bottom));transform:translateX(-50%);min-width:180px;max-width:90%;border-radius:13px;background:#d6fca3;color:#1d2c16;padding:12px 16px;font-size:12px;font-weight:650;text-align:center;box-shadow:0 6px 23px #0008;pointer-events:none}#loading{position:absolute;z-index:65;top:50%;left:50%;transform:translate(-50%,-50%);background:#14242a;border-radius:18px;padding:20px;text-align:center;box-shadow:0 10px 30px #0008;font-size:13px;line-height:2}.spin{display:inline-block;width:23px;height:23px;border:3px solid #455a60;border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
@media(min-width:700px){#empty{left:25px;right:auto;top:50%}.sheet{left:auto;width:445px;border-radius:24px 0 0 0;height:100%;max-height:none}.sheet .handle{display:none}.sheet-head{padding-top:22px}#bottomdock{max-width:420px;left:50%;transform:translateX(-50%);background:transparent}}
#amap{position:absolute;inset:0}.amap-logo,.amap-copyright{bottom:85px!important}#markers{z-index:5}#mapErr{pointer-events:auto;z-index:30}#modeBtn{font-size:12px;width:62px}#controls{align-items:flex-end}#credit{pointer-events:none;left:auto;right:12px;bottom:82px}.desktop-note{font-size:12px;color:var(--muted);line-height:1.7}a{color:#b9ee69}#map{z-index:0;isolation:isolate}
#photoBandShade{position:absolute;inset:0;z-index:42;background:rgba(3,10,15,.10)}
#photoBand{position:absolute;z-index:44;left:8px;right:8px;top:23vh;height:63vh;display:flex;flex-direction:column;background:rgba(13,28,35,.52);border:1px solid rgba(222,242,247,.22);border-radius:20px;box-shadow:0 22px 80px #0008;backdrop-filter:blur(3px);outline:none;overflow:hidden}
.band-head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:15px 26px 4px;flex:0 0 auto}
.band-head h2{font-size:16px;line-height:1.3;margin:0;color:#f3f7f7}.band-head p{font-size:11px;color:#a4b9c2;line-height:1.4;margin:4px 0 0}
#photoBandRail{display:flex;flex:1;min-height:0;gap:26px;overflow-x:auto;overflow-y:hidden;padding:21px 32px 28px;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#6d8b92 #192d35;outline:none;touch-action:pan-x}
.band-card{flex:0 0 auto;height:100%;width:auto;min-width:80px;max-width:85vw;aspect-ratio:4/3;position:relative;border-radius:10px;border:1px solid #ffffff24;background:#0a151b;overflow:hidden;padding:0;box-shadow:0 8px 26px #0006;color:#eef7f7;transition:border-color .15s,box-shadow .15s}
.band-card:hover,.band-card:focus-visible{border-color:#b9ee69;box-shadow:0 8px 26px #0008,0 0 0 1px #b9ee69}
.band-card img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}.band-card .band-caption{position:absolute;left:0;right:0;bottom:0;text-align:left;padding:24px 14px 11px;background:linear-gradient(transparent,#041016dc);font-size:11px;line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.band-card .band-number{position:absolute;top:10px;left:10px;padding:4px 8px;border-radius:20px;background:#08151ebd;font-size:11px}.band-card .band-placeholder{display:grid;place-items:center;height:100%;padding:30px;white-space:normal;color:#adbec7}
#viewer{display:flex;align-items:center;justify-content:center;padding:0;inset:0;background:rgba(2,8,13,.70);backdrop-filter:blur(5px);z-index:60}
#viewerFrame{display:flex;flex-direction:column;width:min(1560px,92vw);height:84vh;background:#101e26;border:1px solid #ffffff2e;border-radius:18px;box-shadow:0 24px 100px #000b;overflow:hidden;outline:none}
#viewerToolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 16px;background:#182a33;min-height:57px;flex:0 0 auto}
#viewerTitle{position:static;font-size:12px;line-height:1.5;color:#e2edf1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.viewer-tools{display:flex;gap:6px;align-items:center;flex-shrink:0}.viewer-tools button{background:#2b414b;color:#edf5f8;border:1px solid #ffffff16;border-radius:9px;height:33px;min-width:33px;padding:0 10px;font-size:15px}.viewer-tools #viewerFit{font-size:11px}.viewer-tools #closeViewer{font-size:23px}.viewer-tools output{min-width:49px;text-align:center;color:#b9ee69;font-size:12px}
#viewerStage{position:relative;flex:1;min-height:0;overflow:hidden;background:#071117;touch-action:none;cursor:default;user-select:none}
#viewer #viewerImg{position:absolute;left:50%;top:50%;max-width:none;max-height:none;width:auto;height:auto;object-fit:contain;transform:translate(-50%,-50%);transform-origin:center;user-select:none;-webkit-user-drag:none;will-change:transform}
.band-file,.band-note{display:block;overflow:hidden;text-overflow:ellipsis}.band-note{font-size:11px;color:#d2dfe1;margin-top:3px}.band-note:empty{display:none}
#viewerNoteBar{position:absolute;z-index:2;left:0;right:0;bottom:0;display:flex;align-items:center;gap:10px;margin:0;padding:10px 16px;background:rgba(7,17,23,.62);border-top:1px solid #ffffff13;backdrop-filter:blur(5px);color:#a9bdc5;font-size:11px;cursor:default;user-select:text}
#viewerNoteBar label{flex-shrink:0;white-space:nowrap}
#viewerNote{flex:1;min-width:0;background:transparent;color:#dce9ed;border:1px solid transparent;border-radius:5px;padding:6px 8px;font:inherit;font-size:12px;outline:none}
#viewerNote::placeholder{color:#91a7b1}#viewerNote:focus{background:#132c3680;border-color:#b9ee6966}
#viewerSaveNote{flex-shrink:0;border:1px solid #ffffff26;border-radius:6px;background:#ffffff0a;color:#c6d6dc;padding:6px 12px;font-size:11px}
#viewerSaveNote:hover{color:#e4f4cf;border-color:#b9ee6970}#viewerSaveNote:disabled{opacity:.5;cursor:wait}
#viewerNoteStatus{flex-shrink:0;font-size:10px;color:#9db4a4;max-width:180px}#viewerNoteStatus[data-error="true"]{color:#f1ba9e}
@media(max-width:700px){#viewerNoteBar{gap:4px;padding:8px}#viewerNoteBar label{font-size:10px}#viewerNote{font-size:11px;padding:6px 4px}#viewerNoteStatus{display:none}}
#roadBtn{width:62px;font-size:12px}#roadBtn[aria-pressed="false"]{color:#b9ee69}
@media(max-width:700px){#photoBand{top:22vh;height:62vh;left:5px;right:5px;border-radius:15px}.band-head{padding:13px 15px 3px}.band-head h2{font-size:14px}.band-head p{font-size:10px}#photoBandRail{gap:14px;padding:15px 15px 22px}.band-card{max-width:85vw}#viewerFrame{width:95vw;height:82vh}#viewerToolbar{padding:9px;flex-wrap:wrap;gap:7px}#viewerTitle{width:100%}.viewer-tools{margin-left:auto}#viewerHint{font-size:10px}}

#empty,#manualbar,#crosshair{display:none!important}#viewerSaveNote[hidden]{display:none}#viewerAmap{font-size:11px;color:#b9ee69;padding:5px;text-decoration:none;white-space:nowrap}#viewerAmap:hover{text-decoration:underline}
</style>
</head>
<body>
<div id="map" aria-label="高德地图"><div id="amap"></div></div><div id="markers"></div><div id="mapErr" class="hide">卫星影像暂时无法加载，请检查网络。<br/>仍可从「照片图库」浏览照片。</div>
<div id="topbar"><div class="topline"><div class="identity"><div class="logo">⌖</div><div><div class="brand">足迹 · 高德照片图库</div><div class="caption">AMAP · SHARED PHOTO LIBRARY</div></div></div><div class="topactions"><button class="round" id="searchBtn" aria-label="搜索">⌕</button></div></div><div class="status"><span class="dot"></span><span id="statText">本机私密图库 · 0 张照片</span></div></div>
<div id="controls"><button class="ctl small" id="roadBtn" title="显示或隐藏卫星图上的道路与地名" aria-pressed="true">路网开</button><button class="ctl small" id="modeBtn" title="切换卫星图与标准地图">标准图</button><button class="ctl small" id="fitBtn" title="查看全部位置">◎</button><button class="ctl" id="zin" title="放大">＋</button><button class="ctl" id="zout" title="缩小">−</button></div>
<div id="empty"><div class="welcome-icon">✦</div><h1>让照片回到拍摄地点</h1><p>把三星手机 DCIM/Camera 中的原始照片复制到电脑，再选择照片或 ZIP。自动读取 GPS，按拍摄地点整理到高德地图。</p><div class="tipline"><span class="tips-accent">✓</span> 本机保存　<span class="tips-accent">✓</span> 原图不上传　<span class="tips-accent">✓</span> 可备份图库</div></div>
<div id="credit">高德地图 · 只读分享版</div>
<div id="bottomdock"><button class="btn outline" id="libraryBtn">▦　照片图库 <span id="badgeN">0</span></button></div>
<div id="crosshair" class="hide">⌖</div><div id="manualbar" class="manualbar hide"><p id="manualText">拖动地图，将十字准星移动到拍摄地点。</p><div class="row"><button class="btn primary" id="useCenter">✓ 使用准星位置</button><button class="btn" id="cancelManual">取消</button></div></div>
<div id="shade" class="hide"></div><section id="sheet" class="sheet hide" aria-modal="true" role="dialog"><div class="handle"></div><div class="sheet-head"><div><h2 id="sheetTitle">导入照片</h2><div class="sub" id="sheetSub">直接使用本机照片</div></div><button id="closeSheet" class="xbtn">×</button></div><div class="sheet-body" id="sheetBody"></div></section>
<div id="photoBandShade" class="hide" aria-hidden="true"></div>
<section id="photoBand" class="hide" role="dialog" aria-modal="true" aria-labelledby="photoBandTitle" tabindex="-1">
  <header class="band-head"><div><h2 id="photoBandTitle">此处的照片</h2><p id="photoBandHint">滚动鼠标滚轮横向浏览 · 点击照片放大</p></div><button id="closePhotoBand" class="xbtn" aria-label="关闭照片带">×</button></header>
  <div id="photoBandRail" tabindex="0" aria-label="当前位置照片，滚轮横向浏览"></div>
</section>
<div id="viewer" class="hide">
  <section id="viewerFrame" role="dialog" aria-modal="true" aria-labelledby="viewerTitle" tabindex="-1">
    <header id="viewerToolbar"><div id="viewerTitle"></div><div class="viewer-tools"><a id="viewerAmap" target="_blank" rel="noopener" hidden>在高德查看</a><button id="viewerZoomOut" aria-label="缩小图片">−</button><output id="viewerZoom" aria-live="polite">100%</output><button id="viewerZoomIn" aria-label="放大图片">＋</button><button id="viewerFit">适应窗口</button><button id="closeViewer" aria-label="关闭大图">×</button></div></header>
    <div id="viewerStage" title="滚轮缩放 · 放大后拖动查看 · 点击弹窗外返回">
      <img id="viewerImg" alt="照片预览" draggable="false"/>
      <form id="viewerNoteBar" aria-label="照片备注编辑">
        <label for="viewerNote">备注 / 关键词</label>
        <input id="viewerNote" type="text" readonly autocomplete="off" placeholder="暂无备注" aria-label="照片备注 / 关键词"/>
        <span id="viewerNoteStatus" role="status" aria-live="polite"></span>
        <button id="viewerSaveNote" type="submit" hidden>保存</button>
      </form>
    </div>
  </section>
</div>

<div id="toast" class="hide" role="status"></div><div id="loading" class="hide"><span class="spin"></span><div id="loadingText">正在解析照片…</div></div>
<script src="./amap-preview.js" defer></script>
</body>
